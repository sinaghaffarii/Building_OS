services:
  postgres:
    image: postgres:16-alpine
    container_name: building_os_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: building_os
      POSTGRES_PASSWORD: building_os_password
      POSTGRES_DB: building_os_db
    ports:
      - "5432:5432"
    volumes:
      - building_os_postgres_data:/var/lib/postgresql/data
    networks:
      - building_os_network

  redis:
    image: redis:7-alpine
    container_name: building_os_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - building_os_redis_data:/data
    networks:
      - building_os_network

volumes:
  building_os_postgres_data:
  building_os_redis_data:

networks:
  building_os_network:
    driver: bridge
